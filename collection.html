<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ma collection - Collection TCG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<!-- Cachée tant que la session n'est pas vérifiée : pas d'écran qui clignote -->
<body class="app" hidden>

  <header class="topbar">
    <p>Connecté en tant que <strong id="username"></strong></p>
    <button type="button" id="logout" class="ghost light">Se déconnecter</button>
  </header>

  <main class="panel">
    <h1>Ma collection</h1>

    <nav class="games" id="games" aria-label="Jeu de cartes"></nav>
    <p class="hint" id="hint">Choisis un jeu pour commencer.</p>

    <section id="workspace" hidden>
      <div class="tabs">
        <button type="button" class="tab" id="tab-mine" aria-pressed="true">Ma collection<span id="count"></span></button>
        <button type="button" class="tab" id="tab-add" aria-pressed="false">Ajouter des cartes</button>
      </div>

      <form id="search-form" class="search" novalidate>
        <div class="field">
          <label for="mode">Rechercher par</label>
          <select id="mode">
            <option value="name">Nom</option>
            <option value="id">Code de la carte</option>
          </select>
        </div>

        <div class="field grow">
          <label for="text" id="text-label">Nom de la carte</label>
          <input id="text" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search">
        </div>

        <div class="field">
          <label for="type">Type</label>
          <select id="type"></select>
        </div>

        <button type="submit" class="primary" id="search-btn" hidden>Rechercher</button>
      </form>

      <p class="status" id="status" aria-live="polite"></p>
      <ul class="cards" id="results"></ul>
      <button type="button" class="secondary" id="more" hidden>Voir plus de résultats</button>
    </section>
  </main>

  <!-- Affiché seulement si le script ne se charge pas : évite la page blanche -->
  <section class="panel" id="boot-error" role="alert" hidden>
    <h1>La page n'a pas pu se charger</h1>
    <p>Vérifie que ces fichiers sont bien à la racine de ton dépôt GitHub : <code>collection.js</code>, <code>games.js</code>, <code>yugioh.js</code> et <code>config.js</code>, puis recharge avec Ctrl + Maj + R.</p>
    <p>Détail technique : <span id="boot-error-detail"></span></p>
  </section>

  <script>
    function showBootError(detail) {
      document.body.hidden = false;
      document.querySelector('main').hidden = true;
      document.querySelector('.topbar').hidden = true;
      document.getElementById('boot-error-detail').textContent = detail || 'voir la console (F12)';
      document.getElementById('boot-error').hidden = false;
    }
    window.addEventListener('error', (e) => showBootError(e.message));
    window.addEventListener('unhandledrejection', (e) => showBootError(String((e.reason && e.reason.message) || e.reason)));
  </script>
  <script type="module" src="collection.js"
          onerror="showBootError('fichier introuvable (collection.js, games.js ou yugioh.js)')"></script>
</body>
</html>
